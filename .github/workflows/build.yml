name: Build ImmortalWrt R4S

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-r4s.yml"

env:
  IMMORTALWRT_VERSION: "25.12.0"
  TARGET: "rockchip/armv8"
  PROFILE: "friendlyarm_nanopi-r4s"
  IMAGEBUILDER_URL: "https://downloads.immortalwrt.org/releases/25.12.0/targets/rockchip/armv8/immortalwrt-imagebuilder-25.12.0-rockchip-armv8.Linux-x86_64.tar.zst"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            zstd \
            tar

      - name: Download ImageBuilder
        run: |
          wget -O imagebuilder.tar.zst "${IMAGEBUILDER_URL}"
          tar --use-compress-program=unzstd -xf imagebuilder.tar.zst
          mv immortalwrt-imagebuilder-* ib
          ls -la ib

      - name: Download third-party packages
        run: |
          cd ib

          mkdir -p packages

          echo "==== Download mosdns package ===="
          wget -O mosdns.tar.gz "https://github.com/sbwml/luci-app-mosdns/releases/download/v5.3.4-r5/aarch64_generic-openwrt-25.12.tar.gz"

          mkdir -p /tmp/mosdns
          tar -xzf mosdns.tar.gz -C /tmp/mosdns

          echo "==== Copy mosdns APK packages ===="
          find /tmp/mosdns -type f -name "*.apk" -print -exec cp -f {} packages/ \;

          echo "==== Download OpenClash latest APK ===="
          OPENCLASH_URL="$(curl -fsSL https://api.github.com/repos/vernesong/OpenClash/releases/latest \
            | grep -oE 'https://[^"]+luci-app-openclash-[^"]+\.apk' \
            | head -n1)"

          if [ -z "$OPENCLASH_URL" ]; then
            echo "ERROR: Cannot find OpenClash APK download URL"
            exit 1
          fi

          echo "OpenClash APK URL: $OPENCLASH_URL"
          wget -O packages/luci-app-openclash.apk "$OPENCLASH_URL"

          echo "==== Third-party packages ===="
          ls -lh packages | sed -n '1,120p'

      - name: Build firmware
        run: |
          cd ib

          make image PROFILE="${PROFILE}" PACKAGES="\
          luci \
          luci-base \
          luci-ssl \
          luci-i18n-base-zh-cn \
          luci-i18n-firewall-zh-cn \
          luci-theme-argon \
          luci-app-argon-config \
          bash \
          curl \
          wget-ssl \
          ca-certificates \
          unzip \
          nano \
          htop \
          openssh-sftp-server \
          bind-dig \
          bind-host \
          tcpdump \
          mtr \
          traceroute \
          iperf3 \
          luci-app-ttyd \
          luci-app-commands \
          ddns-scripts \
          luci-app-ddns \
          ddns-scripts-cloudflare \
          luci-proto-wireguard \
          wireguard-tools \
          qrencode \
          zerotier \
          luci-app-zerotier \
          miniupnpd-nftables \
          luci-app-upnp \
          luci-app-nlbwmon \
          luci-app-sqm \
          luci-app-statistics \
          rsync \
          smartmontools \
          docker \
          dockerd \
          docker-compose \
          luci-app-dockerman \
          luci-app-openclash \
          luci-app-mosdns \
          mosdns \
          "

      - name: List output
        run: |
          echo "==== Firmware output ===="
          find ib/bin/targets -type f | sort
          mkdir -p output
          cp -av ib/bin/targets/*/*/*.img.gz output/ || true
          cp -av ib/bin/targets/*/*/*.manifest output/ || true
          ls -lh output

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-r4s-${{ env.IMMORTALWRT_VERSION }}
          path: output/*
